  # ───────────────────────────────────────────────────────────────────────────
  # Domain — Chat AI (Phase 1, SSE)
  # ───────────────────────────────────────────────────────────────────────────
  /notebooks/{notebookId}/chat/source:
    parameters:
      - $ref: "#/components/parameters/notebookId"
    post:
      tags: [Chat]
      operationId: streamSourceChat
      summary: Message to source chat (RAG notebook-scoped) — SSE response
      description: |
        Chat grounded on notebook documents. `documentIds` restricts retrieval to a
        subset of sources; absent = entire notebook. `conversationId` absent = new
        thread created implicitly (its id is returned in the `done` event via the persisted message).

        Response in `text/event-stream` — SSE convention at document head:
        `token`* → `citations` (once) → `done` → `[DONE]`.
      x-status: adapt
      x-source: "POST /chats — chat.controller.ts:23 + POST /chats/:chatId — chat.controller.ts:108 (today: unauthenticated Socket.io — stream.gateway.ts:35, single-document — chats.document_id NOT NULL, search_vectors single-doc — ai.service.ts:179; citations persisted but never returned — chat.service.ts:168) · SOP §3.1, §4.9 · divergence 7 settled"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1 }
                conversationId:
                  type: string
                  format: uuid
                  description: Existing thread to continue; absent = new thread.
                documentIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Retrieval scope; absent = entire notebook.
      responses:
        "200":
          description: >
            SSE stream (convention at document head). Each `data:` line carries JSON
            conforming to the `ChatStreamEvent` schema (oneOf discriminated by `type`):
            `token`* → `citations` (once) → `done`, then sentinel `data: [DONE]`.
            If flow fails: `error` event then close.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Stream of `data: {json}\\n\\n` events. JSON for each event: see ChatStreamEvent."
              x-sse-event-schema: "#/components/schemas/ChatStreamEvent"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /chat/general:
    post:
      tags: [Chat]
      operationId: streamGeneralChat
      summary: Message to general chat (Graspr AI, non-grounded) — SSE response
      description: General assistant without document grounding. Same SSE convention, without `citations` event.
      x-status: new
      x-source: "SOP §3.1, §4.9 (no non-grounded chat today — all ChatTypeEnum are scoped to a document)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1 }
                conversationId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: >
            SSE stream — `token`* → `done`, sentinel `[DONE]`. Same event schemas as
            source chat (`ChatStreamEvent`), without `citations` event.
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-event-schema: "#/components/schemas/ChatStreamEvent"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /notebooks/{notebookId}/chat/source/history:
    parameters:
      - $ref: "#/components/parameters/notebookId"
    get:
      tags: [Chat]
      operationId: getSourceChatHistory
      summary: Source chat history (paginated)
      x-status: adapt
      x-source: "GET /chats/:chatId — chat.controller.ts:154 (today per chat, without citations or pagination — chat.service.ts:320-330) · SOP §3.1"
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: conversationId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filter on a thread; absent = entire notebook history.
      responses:
        "200":
          description: Messages from most recent to oldest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Chat]
      operationId: clearSourceChatHistory
      summary: Clear source chat history from notebook
      x-status: adapt
      x-source: "DELETE /chats/:chatId — chat.controller.ts:184 (today per chat) · SOP §3.1"
      responses:
        "204": { description: History cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────────────────────────────────────────────────────
  # Domain — Summaries (Phase 1, async job)
  # ───────────────────────────────────────────────────────────────────────────

  /notebooks/{notebookId}/summaries/generate:
    parameters:
      - $ref: "#/components/parameters/notebookId"
    post:
      tags: [Summaries]
      operationId: generateSummary
      summary: Generate a summary (asynchronous)
      description: >
        Path aligned with unified pattern `…/<resource>/generate` (§5.5) — SOP writes
        `POST /notebooks/:id/summary`, one-line adjustment on frontend. Multiple summaries
        per notebook allowed (existing limits one per document — guard removed in contract).
        v1: quota/premium gating is not applied yet — 403 and 429 are declared for the
        generated client, they are not emitted today.
      x-status: adapt
      x-source: "POST /chats/summary — chat.controller.ts:74 (synchronous, single-document, without length/format, 1 summary max — chat.service.ts:69-75,95,103) · SOP §3.4 · plan §5.5"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateSummaryRequest" }
      responses:
        "202":
          description: "Generation accepted — `resourceType: summary` in polling."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /notebooks/{notebookId}/summaries:
    parameters:
      - $ref: "#/components/parameters/notebookId"
    get:
      tags: [Summaries]
      operationId: listSummaries
      summary: Summaries of a notebook
      x-status: new
      x-source: "SOP §3.4 (no list route — content returned only by POST today; data present in chats type=summary)"
      responses:
        "200":
          description: Bounded list → bare array (most recently generated first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotebookSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notebooks/{notebookId}/summaries/{summaryId}:
    parameters:
      - $ref: "#/components/parameters/notebookId"
      - name: summaryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Summaries]
      operationId: getSummary
      summary: Summary details
      x-status: new
      x-source: "SOP §3.4 (SOP path `…/summary/:summaryId` normalized to plural — §5.1)"
      responses:
        "200":
          description: Complete summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Summaries]
      operationId: deleteSummary
      summary: Delete a summary
      description: Deletion is currently explicitly forbidden in the code (`DELETE /chats/:chatId` refuses `type=summary`) — the contract allows it, the code will adapt.
      x-status: new
      x-source: "SOP §3.4 · domain inventory 9"
      responses:
        "204": { description: Summary deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase session JWT. Claims read by the backend — `sub` (userId), `email`.

  parameters:
    notebookId:
      name: notebookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      description: Page size (unbounded lists).
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque cursor returned by `nextCursor`.
    documentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    noteId:
      name: noteId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token missing, invalid, or expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "Invalid or expired token", code: "UNAUTHORIZED" }
    Forbidden:
      description: Insufficient permission or quota.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "Monthly AI prompt quota exceeded", code: "QUOTA_EXCEEDED" }
    NotFound:
      description: Resource not found (or not belonging to the user).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "Notebook not found", code: "NOT_FOUND" }
    Conflict:
      description: State conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: Well-formed but invalid request body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "title must not be empty", code: "VALIDATION_FAILED" }
    TooManyRequests:
      description: Rate limit reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ── Shared ──────────────────────────────────────────────────────────
    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          description: Human-readable message, displayable by the frontend.
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          description: Stable machine code, SNAKE_CASE (e.g. `QUOTA_EXCEEDED`, `VALIDATION_FAILED`).

    Page:
      type: object
      description: >
        Cursor pagination wrapper for unbounded lists. Concrete responses
        specialize `items` (e.g. `items: ChatMessage[]`).
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; `null` = end of list.

    JobAccepted:
      type: object
      description: Response `202 Accepted` for any asynchronous trigger.
      required: [jobId, estimatedSeconds]
      properties:
        jobId: { type: string, format: uuid }
        estimatedSeconds:
          type: integer
          minimum: 1
          description: Indicative estimate to calibrate the wait UI.

    JobStatus:
      type: string
      enum: [pending, processing, ready, failed]
      description: Unique vocabulary for asynchronous status throughout the contract.

    Job:
      type: object
      description: State of an asynchronous job — `GET /jobs/:jobId` (unified polling).
      required: [jobId, status, resourceType]
      properties:
        jobId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        stage:
          type: string
          enum: [transcribing, chunking, indexing]
          description: Current step during `processing` — document ingestion only, informational.
        resourceType:
          type: string
          enum: [document, summary, quiz, flashcards, video, podcast, mindmap]
        resourceId:
          type: string
          format: uuid
          description: Present when `status = ready` — ID of the generated resource to retrieve.
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type: string
          description: Failure message, present when `status = failed`.

    # ── Notebooks & Folders ──────────────────────────────────────────────────
    Notebook:
      type: object
      required: [id, title, folderId, pinned, visibility, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        folderId:
          type: [string, "null"]
          format: uuid
          description: Parent folder; `null` = root.
        pinned: { type: boolean }
        visibility:
          type: string
          enum: [private, shared]
          default: private
        prompt:
          type: [string, "null"]
          description: Study intent entered at creation ("What are we studying today?").
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NotebookListItem:
      type: object
      description: Lightweight form for the sidebar (SOP §1.3.4).
      required: [id, title, pinned, documentCount, lastAccessedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        pinned: { type: boolean }
        documentCount: { type: integer, minimum: 0 }
        lastAccessedAt:
          type: [string, "null"]
          format: date-time

    NotebookFolder:
      type: object
      required: [id, label, notebooks]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        notebooks:
          type: array
          items: { $ref: "#/components/schemas/NotebookListItem" }

    NotebookTree:
      type: object
      required: [folders, rootNotebooks]
      properties:
        folders:
          type: array
          items: { $ref: "#/components/schemas/NotebookFolder" }
        rootNotebooks:
          type: array
          items: { $ref: "#/components/schemas/NotebookListItem" }

    NotebookDetail:
      allOf:
        - $ref: "#/components/schemas/Notebook"
        - type: object
          required: [documents]
          properties:
            documents:
              type: array
              items: { $ref: "#/components/schemas/NotebookDocument" }

    CreateNotebookRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        folderId:
          type: [string, "null"]
          format: uuid
        prompt: { type: string }
        visibility:
          type: string
          enum: [private, shared]
          default: private

    UpdateNotebookRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        visibility:
          type: string
          enum: [private, shared]

    Folder:
      type: object
      required: [id, label, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ── Documents (shared schema, exposed by NotebookDetail — complete domain coming) ──
    DocumentKind:
      type: string
      enum: [pdf, audio, video, video-overview, recording]
      description: SOP §1.4.1. `recording` = deferred domain (outside Phase 1), present for type compatibility.

    NotebookDocument:
      type: object
      required: [id, label, kind, uploadedAt, processingStatus]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        extension: { type: string }
        uploadedAt: { type: string, format: date-time }
        processingStatus: { $ref: "#/components/schemas/JobStatus" }

    # ── Users & me ───────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, email, fullName, onboardingComplete, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        profilePicture:
          type: [string, "null"]
          format: uri
        language:
          type: [string, "null"]
          description: ISO 639-1 — interface preference.
        colorMode:
          type: [string, "null"]
          enum: [light, auto, dark, null]
        onboardingComplete: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpdateUserProfileRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        language: { type: string }
        colorMode:
          type: string
          enum: [light, auto, dark]
        onboardingComplete: { type: boolean }

    OnboardingRequest:
      type: object
      required: [language, skillArea, learningStyles, studyRhythm]
      properties:
        language:
          type: string
          enum: [en, fr]
        skillArea:
          type: string
          enum: [academic, professional, creative]
        learningStyles:
          type: array
          items: { type: string }
        studyRhythm: { type: string }
        invitedEmails:
          type: array
          items: { type: string, format: email }
          default: []

    NotificationChannel:
      type: string
      enum: [email_push, email_only, push_only]

    NotificationPreferences:
      type: object
      description: The 7 types from SOP §1.6.2 — each with its delivery channel.
      properties:
        newMessage: { $ref: "#/components/schemas/NotificationChannel" }
        quizWarChallenge: { $ref: "#/components/schemas/NotificationChannel" }
        studyReminder: { $ref: "#/components/schemas/NotificationChannel" }
        friendJoin: { $ref: "#/components/schemas/NotificationChannel" }
        teamInvite: { $ref: "#/components/schemas/NotificationChannel" }
        weeklySummary: { $ref: "#/components/schemas/NotificationChannel" }
        productUpdates: { $ref: "#/components/schemas/NotificationChannel" }

    StudyStreak:
      type: object
      required: [currentStreak, longestStreak, totalDaysStudied, dailyActivity]
      properties:
        currentStreak: { type: integer, minimum: 0 }
        longestStreak: { type: integer, minimum: 0 }
        totalDaysStudied: { type: integer, minimum: 0 }
        dailyActivity:
          type: array
          items:
            type: object
            required: [date, minutesStudied, completed]
            properties:
              date: { type: string, format: date }
              minutesStudied: { type: integer, minimum: 0 }
              completed: { type: boolean }

    TopicProgress:
      type: object
      required: [topicId, label, notebookId, understandingPct, lastActivityAt]
      properties:
        topicId: { type: string, format: uuid }
        label: { type: string }
        notebookId: { type: string, format: uuid }
        understandingPct: { type: integer, minimum: 0, maximum: 100 }
        lastActivityAt: { type: string, format: date-time }

    Friend:
      type: object
      required: [userId, displayName, email]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        avatarUrl:
          type: [string, "null"]
          format: uri
        friendSince:
          type: [string, "null"]
          format: date-time

    UserSession:
      type: object
      required: [id, device, lastSeenAt, current]
      properties:
        id: { type: string }
        device: { type: string, description: "Browser / OS (summarized user-agent)." }
        location: { type: [string, "null"] }
        lastSeenAt: { type: string, format: date-time }
        current:
          type: boolean
          description: Session carrying the token of the current request.

    ContactInfo:
      type: object
      required: [userId, displayName, email, sharedNotebooks, mutualFriends]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        avatarUrl:
          type: [string, "null"]
          format: uri
        sharedNotebooks:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
        mutualFriends: { type: integer, minimum: 0 }
        friendSince:
          type: [string, "null"]
          format: date-time

    # ── Documents & ingestion ────────────────────────────────────────────────
    DocumentJobAccepted:
      description: >
        202 response for ingestion — the document exists immediately (`processingStatus: pending`),
        `documentId` allows displaying the row and polling the ingestion status.
      allOf:
        - $ref: "#/components/schemas/JobAccepted"
        - type: object
          required: [documentId]
          properties:
            documentId: { type: string, format: uuid }

    DocumentProcessingStatus:
      type: object
      description: Ingestion shape (SOP §3.8) constrained to unified vocabulary + informational `stage`.
      required: [documentId, status]
      properties:
        documentId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        stage:
          type: string
          enum: [transcribing, chunking, indexing]
          description: Current step during `processing` (informational).
        progress: { type: integer, minimum: 0, maximum: 100 }
        errorMessage: { type: string }
        readyAt: { type: string, format: date-time }

    TranscriptSegment:
      type: object
      required: [content, start, end]
      properties:
        content: { type: string }
        start: { type: number, description: Seconds. }
        end: { type: number, description: Seconds. }

    DocumentChapter:
      type: object
      required: [name]
      properties:
        name: { type: string }
        pageNumber: { type: [integer, "null"] }
        startSeconds: { type: [number, "null"] }

    DocumentPreview:
      type: object
      description: >
        Content according to `kind` — `pdf`: `url` (signed viewer URL); `audio`/`video`:
        `transcript` + `chapters`.
      required: [documentId, kind]
      properties:
        documentId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        url:
          type: [string, "null"]
          format: uri
        transcript:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/TranscriptSegment" }
        chapters:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/DocumentChapter" }

    # ── Notes ────────────────────────────────────────────────────────────────
    Note:
      type: object
      required: [id, notebookId, title, body, sourceDocumentId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        notebookId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, description: Markdown. }
        sourceDocumentId:
          type: [string, "null"]
          format: uuid
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateNoteRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        body: { type: string }
        sourceDocumentId:
          type: string
          format: uuid

    # ── Calendar & study sessions ────────────────────────────────────────────
    CalendarEventParticipant:
      type: object
      required: [email]
      properties:
        userId:
          type: [string, "null"]
          format: uuid
          description: Set if the participant is a Graspr user.
        email: { type: string, format: email }
        isYou: { type: boolean, default: false }

    CalendarEvent:
      type: object
      required: [id, seriesId, title, date, startTime, endTime, color, notebookId, activeRecall, completed, participants]
      properties:
        id: { type: string, format: uuid }
        seriesId:
          type: [string, "null"]
          format: uuid
          description: Present if the occurrence belongs to a recurring series.
        title: { type: string }
        date: { type: string, format: date }
        startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "HH:mm, user's local time." }
        endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        color:
          type: string
          description: "Hex (#RRGGBB) — frontend derives the bar/tint/filled variants."
        notebookId:
          type: [string, "null"]
          format: uuid
        activeRecall: { type: boolean }
        completed: { type: boolean }
        participants:
          type: array
          items: { $ref: "#/components/schemas/CalendarEventParticipant" }

    CreateCalendarEventRequest:
      type: object
      required: [title, color, from, to, startDate, timezone]
      properties:
        title: { type: string, minLength: 1 }
        color: { type: string, description: "Hex (#RRGGBB), one of 8 frontend presets." }
        from: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        to: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        startDate: { type: string, format: date }
        timezone: { type: string, description: "IANA (e.g., Europe/Paris) — required for scheduling (§5.9)." }
        notebookId:
          type: [string, "null"]
          format: uuid
        activeRecall: { type: boolean, default: false }
        recurrence:
          type: string
          enum: [none, daily, weekly]
          default: none
        includeWeekends:
          type: boolean
          default: false
          description: Applies to `recurrence=daily`.
        endDate:
          type: [string, "null"]
          format: date
          description: End of series (required if `recurrence` ≠ none).
        friendIds:
          type: array
          items: { type: string, format: uuid }
          default: []

    UpdateCalendarEventRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string }
        color: { type: string }
        date: { type: string, format: date }
        from: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        to: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        notebookId:
          type: [string, "null"]
          format: uuid
        activeRecall: { type: boolean }
        completed: { type: boolean }
        scope:
          type: string
          enum: [single, series]
          default: single
          description: Scope of the modification for a series occurrence.

    TodaysPlanItem:
      type: object
      required: [id, notebookId, notebookTitle, timeLabel, color, activeRecall, completed]
      properties:
        id: { type: string, format: uuid }
        notebookId:
          type: [string, "null"]
          format: uuid
        notebookTitle: { type: [string, "null"] }
        timeLabel: { type: string, description: "E.g., \"9:00 AM – 10:00 AM\"." }
        color: { type: string }
        activeRecall: { type: boolean }
        completed: { type: boolean }

    CalendarConnection:
      type: object
      required: [provider, connectedAt]
      properties:
        provider:
          type: string
          enum: [google, microsoft]
        accountEmail: { type: [string, "null"], format: email }
        connectedAt: { type: string, format: date-time }

    StudySession:
      type: object
      required: [id, notebookId, durationSeconds, completedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        notebookId:
          type: [string, "null"]
          format: uuid
        durationSeconds: { type: integer, minimum: 1, maximum: 86400 }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    # ── Search ───────────────────────────────────────────────────────────────
    SearchResult:
      type: object
      required: [notebooks, documents, notes]
      properties:
        notebooks:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
        documents:
          type: array
          items:
            type: object
            required: [id, name, notebookId]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              notebookId: { type: string, format: uuid }
        notes:
          type: array
          items:
            type: object
            required: [id, excerpt, notebookId]
            properties:
              id: { type: string, format: uuid }
              excerpt: { type: string }
              notebookId: { type: string, format: uuid }

    # ── Chat AI ──────────────────────────────────────────────────────────────
    Citation:
      type: object
      description: >
        Response grounding — metadata already exists at ingestion
        (page_number, start, end — ai.service.ts:100-112).
      required: [documentId, excerpt]
      properties:
        documentId: { type: string, format: uuid }
        excerpt: { type: string }
        pageNumber: { type: [integer, "null"] }
        startSeconds:
          type: [number, "null"]
          description: For audio/video sources.
        endSeconds: { type: [number, "null"] }

    ChatMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string, description: Markdown. }
        createdAt: { type: string, format: date-time }
        sourceDocumentIds:
          type: array
          items: { type: string, format: uuid }
          description: Source mode only — cited documents.
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
          description: Source mode only, assistant messages.

    ChatMessagePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ChatMessage" }

    # ── Chat SSE events (JSON payload for `data:` lines) ─────────────────
    ChatTokenEvent:
      type: object
      required: [type, content]
      properties:
        type: { const: token }
        content:
          type: string
          description: Text fragment to concatenate, in order of arrival.

    ChatCitationsEvent:
      type: object
      description: Emitted only once, before `done` — source mode only.
      required: [type, citations]
      properties:
        type: { const: citations }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }

    ChatDoneEvent:
      type: object
      description: Terminal — the assistant message is persisted, retrievable via history.
      required: [type, messageId]
      properties:
        type: { const: done }
        messageId: { type: string, format: uuid }
        conversationId:
          type: string
          format: uuid
          description: Returned to allow frontend to continue an implicitly created thread.

    ChatErrorEvent:
      type: object
      description: Stream failure — same semantics as `Error` schema, then closure.
      required: [type, message, code]
      properties:
        type: { const: error }
        message: { type: string }
        code: { type: string, pattern: "^[A-Z0-9_]+$" }

    ChatStreamEvent:
      description: >
        JSON payload of an SSE stream `data:` line. The final sentinel `data: [DONE]`
        is not JSON and is not covered by this schema.
      oneOf:
        - $ref: "#/components/schemas/ChatTokenEvent"
        - $ref: "#/components/schemas/ChatCitationsEvent"
        - $ref: "#/components/schemas/ChatDoneEvent"
        - $ref: "#/components/schemas/ChatErrorEvent"
      discriminator:
        propertyName: type
        mapping:
          token: "#/components/schemas/ChatTokenEvent"
          citations: "#/components/schemas/ChatCitationsEvent"
          done: "#/components/schemas/ChatDoneEvent"
          error: "#/components/schemas/ChatErrorEvent"

    # ── Summaries ────────────────────────────────────────────────────────────
    GenerateSummaryRequest:
      type: object
      required: [length, format]
      properties:
        documentIds:
          type: array
          items: { type: string, format: uuid }
          description: Subset of sources; absent = entire notebook.
        length:
          type: string
          enum: [brief, standard, detailed]
        format:
          type: string
          enum: [paragraphs, bullet_points, outline]

    NotebookSummary:
      type: object
      required: [id, notebookId, title, body, wordCount, generatedAt, sourceDocumentIds, length, format]
      properties:
        id: { type: string, format: uuid }
        notebookId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, description: Markdown. }
        wordCount: { type: integer, minimum: 0 }
        generatedAt: { type: string, format: date-time }
        sourceDocumentIds:
          type: array
          items: { type: string, format: uuid }
        length:
          type: string
          enum: [brief, standard, detailed]
        format:
          type: string
          enum: [paragraphs, bullet_points, outline]
