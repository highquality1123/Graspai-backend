# Streaming SSE (chat V2) — NE PAS SUPPRIMER.
# Le contrat expose des réponses `text/event-stream` (openapi.yaml → POST /notebooks/:id/chat/source
# et POST /chat/general) : sans ces directives, nginx BUFFERISE la réponse et le client ne reçoit
# rien avant la fin du flux — le streaming token-par-token ne fonctionne pas.
# Les timeouts sont volontairement laissés aux valeurs existantes (graspr.conf, 300s) : le domaine
# Chat devra implémenter un HEARTBEAT SSE (~20s) qui rend les timeouts nginx et ALB non critiques
# (prérequis tracé dans docs/v2-socle-debt.md).
proxy_buffering off;
proxy_cache off;
