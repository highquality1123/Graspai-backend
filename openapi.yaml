      x-source: "SOP §1.3.5 (aucune table study_sessions)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationSeconds, completedAt]
              properties:
                notebookId:
                  type: [string, "null"]
                  format: uuid
                durationSeconds: { type: integer, minimum: 1, maximum: 86400 }
                completedAt: { type: string, format: date-time }
      responses:
        "201":
          description: Session enregistrée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudySession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ───────────────────────────────────────────────────────────────────────────
  # Domaine — Search (Phase 1)
  # ───────────────────────────────────────────────────────────────────────────

  /search:
    get:
      tags: [Search]
      operationId: globalSearch
      summary: Recherche globale (top bar)
      description: >
        Recherche par nom/titre sur notebooks, documents et notes (full-text simple en Phase 1 —
        la recherche sémantique cross-document est une brique ultérieure, PLAN_TRAVAIL_V2 §27).
      x-status: new
      x-source: "SOP §1.3.6 (aucun endpoint de recherche ; search_vectors est interne et mono-document — ai.service.ts:179)"
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Résultats groupés par type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────────────────────────────────────────────────────
  # Domaine — Chat AI (Phase 1, SSE)
  # ───────────────────────────────────────────────────────────────────────────

  /notebooks/{notebookId}/chat/source:
    parameters:
      - $ref: "#/components/parameters/notebookId"
    post:
      tags: [Chat]
      operationId: streamSourceChat
      summary: Message au chat source (RAG notebook-scoped) — réponse SSE
      description: |
        Chat groundé sur les documents du notebook. `documentIds` restreint le retrieval à un
        sous-ensemble de sources ; absent = tout le notebook. `conversationId` absent = nouveau
        thread créé implicitement (son id revient dans l'event `done` via le message persisté).

        Réponse en `text/event-stream` — convention SSE en tête de document :
        `token`* → `citations` (une fois) → `done` → `[DONE]`.
      x-status: adapt
      x-source: "POST /chats — chat.controller.ts:23 + POST /chats/:chatId — chat.controller.ts:108 (aujourd'hui : Socket.io non authentifié — stream.gateway.ts:35, mono-document — chats.document_id NOT NULL, search_vectors mono-doc — ai.service.ts:179 ; citations persistées mais jamais renvoyées — chat.service.ts:168) · SOP §3.1, §4.9 · divergence 7 tranchée"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1 }
                conversationId:
                  type: string
                  format: uuid
                  description: Thread existant à poursuivre ; absent = nouveau thread.
                documentIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Scope du retrieval ; absent = tout le notebook.
      responses:
        "200":
          description: >
            Flux SSE (convention en tête de document). Chaque ligne `data:` porte un JSON
            conforme au schéma `ChatStreamEvent` (oneOf discriminé par `type`) :
            `token`* → `citations` (une fois) → `done`, puis sentinelle `data: [DONE]`.
            En cas d'échec en cours de flux : event `error` puis fermeture.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Suite d'événements `data: {json}\\n\\n`. JSON de chaque event : voir ChatStreamEvent."
              x-sse-event-schema: "#/components/schemas/ChatStreamEvent"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /chat/general:
    post:
      tags: [Chat]
      operationId: streamGeneralChat
      summary: Message au chat général (Graspr AI, non groundé) — réponse SSE
      description: Assistant général sans grounding documentaire. Même convention SSE, sans event `citations`.
      x-status: new
      x-source: "SOP §3.1, §4.9 (aucun chat non-groundé aujourd'hui — tous les ChatTypeEnum sont scopés à un document)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1 }
                conversationId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: >
            Flux SSE — `token`* → `done`, sentinelle `[DONE]`. Mêmes schémas d'events que le
            chat source (`ChatStreamEvent`), sans event `citations`.
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-event-schema: "#/components/schemas/ChatStreamEvent"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /notebooks/{notebookId}/chat/source/history:
    parameters:
      - $ref: "#/components/parameters/notebookId"
    get:
      tags: [Chat]
      operationId: getSourceChatHistory
      summary: Historique du chat source (paginé)
      x-status: adapt
      x-source: "GET /chats/:chatId — chat.controller.ts:154 (aujourd'hui par chat, sans citations ni pagination — chat.service.ts:320-330) · SOP §3.1"
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: conversationId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtrer sur un thread ; absent = tout l'historique du notebook.
      responses:
        "200":
          description: Messages du plus récent au plus ancien.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Chat]
      operationId: clearSourceChatHistory
      summary: Vider l'historique du chat source du notebook
      x-status: adapt
      x-source: "DELETE /chats/:chatId — chat.controller.ts:184 (aujourd'hui par chat) · SOP §3.1"
      responses:
        "204": { description: Historique vidé. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────────────────────────────────────────────────────
  # Domaine — Summaries (Phase 1, job async)
  # ───────────────────────────────────────────────────────────────────────────

  /notebooks/{notebookId}/summaries/generate:
    parameters:
      - $ref: "#/components/parameters/notebookId"
    post:
      tags: [Summaries]
      operationId: generateSummary
      summary: Générer un résumé (asynchrone)
      description: >
        Chemin aligné sur le pattern unifié `…/<resource>/generate` (§5.5) — le SOP écrit
        `POST /notebooks/:id/summary`, ajustement d'une ligne côté front. Plusieurs résumés
        par notebook autorisés (l'existant en limite un par document — garde levée au contrat).
        v1 : le gating quota/premium n'est pas encore appliqué — les 403 et 429 sont déclarés
        pour le client généré, ils ne sont pas émis aujourd'hui.
      x-status: adapt
      x-source: "POST /chats/summary — chat.controller.ts:74 (synchrone, mono-document, sans length/format, 1 résumé max — chat.service.ts:69-75,95,103) · SOP §3.4 · plan §5.5"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateSummaryRequest" }
      responses:
        "202":
          description: "Génération acceptée — `resourceType: summary` au polling."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /notebooks/{notebookId}/summaries:
    parameters:
      - $ref: "#/components/parameters/notebookId"
    get:
      tags: [Summaries]
      operationId: listSummaries
      summary: Résumés d'un notebook
      x-status: new
      x-source: "SOP §3.4 (aucune route de liste — le contenu n'est renvoyé que par le POST aujourd'hui ; données présentes dans chats type=summary)"
      responses:
        "200":
          description: Liste bornée → tableau nu (généré le plus récent en premier).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotebookSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notebooks/{notebookId}/summaries/{summaryId}:
    parameters:
      - $ref: "#/components/parameters/notebookId"
      - name: summaryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Summaries]
      operationId: getSummary
      summary: Détail d'un résumé
      x-status: new
      x-source: "SOP §3.4 (chemin SOP `…/summary/:summaryId` normalisé au pluriel — §5.1)"
      responses:
        "200":
          description: Résumé complet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Summaries]
      operationId: deleteSummary
      summary: Supprimer un résumé
      description: La suppression est aujourd'hui explicitement interdite côté code (`DELETE /chats/:chatId` refuse `type=summary`) — le contrat l'autorise, le code s'adaptera.
      x-status: new
      x-source: "SOP §3.4 · inventaire domaine 9"
      responses:
        "204": { description: Résumé supprimé. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de session Supabase. Claims lus par le backend — `sub` (userId), `email`.

  parameters:
    notebookId:
      name: notebookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      description: Taille de page (listes non bornées).
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Curseur opaque renvoyé par `nextCursor`.
    documentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    noteId:
      name: noteId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Requête invalide.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token absent, invalide ou expiré.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "Invalid or expired token", code: "UNAUTHORIZED" }
    Forbidden:
      description: Permission ou quota insuffisant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "Monthly AI prompt quota exceeded", code: "QUOTA_EXCEEDED" }
    NotFound:
      description: Ressource introuvable (ou n'appartenant pas à l'utilisateur).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "Notebook not found", code: "NOT_FOUND" }
    Conflict:
      description: Conflit d'état.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: Corps de requête bien formé mais invalide.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "title must not be empty", code: "VALIDATION_FAILED" }
    TooManyRequests:
      description: Rate limit atteint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ── Transverses ──────────────────────────────────────────────────────────
    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          description: Message lisible, affichable par le front.
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
          description: Code machine stable, SNAKE_CASE (ex. `QUOTA_EXCEEDED`, `VALIDATION_FAILED`).

    Page:
      type: object
      description: >
        Enveloppe de pagination par curseur des listes non bornées. Les réponses concrètes
        spécialisent `items` (ex. `items: ChatMessage[]`).
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, "null"]
          description: Curseur opaque de la page suivante ; `null` = fin de liste.

    JobAccepted:
      type: object
      description: Réponse `202 Accepted` de tout déclenchement asynchrone.
      required: [jobId, estimatedSeconds]
      properties:
        jobId: { type: string, format: uuid }
        estimatedSeconds:
          type: integer
          minimum: 1
          description: Estimation indicative pour calibrer l'UI d'attente.

    JobStatus:
      type: string
      enum: [pending, processing, ready, failed]
      description: Vocabulaire unique de statut asynchrone dans tout le contrat.

    Job:
      type: object
      description: État d'un traitement asynchrone — `GET /jobs/:jobId` (polling unifié).
      required: [jobId, status, resourceType]
      properties:
        jobId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        stage:
          type: string
          enum: [transcribing, chunking, indexing]
          description: Étape courante pendant `processing` — ingestion documents uniquement, informatif.
        resourceType:
          type: string
          enum: [document, summary, quiz, flashcards, video, podcast, mindmap]
        resourceId:
          type: string
          format: uuid
          description: Présent quand `status = ready` — id de la ressource générée à récupérer.
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type: string
          description: Message d'échec, présent quand `status = failed`.

    # ── Notebooks & Folders ──────────────────────────────────────────────────
    Notebook:
      type: object
      required: [id, title, folderId, pinned, visibility, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        folderId:
          type: [string, "null"]
          format: uuid
          description: Dossier parent ; `null` = racine.
        pinned: { type: boolean }
        visibility:
          type: string
          enum: [private, shared]
          default: private
        prompt:
          type: [string, "null"]
          description: Intention d'étude saisie à la création ("What are we studying today?").
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NotebookListItem:
      type: object
      description: Forme allégée pour le sidebar (SOP §1.3.4).
      required: [id, title, pinned, documentCount, lastAccessedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        pinned: { type: boolean }
        documentCount: { type: integer, minimum: 0 }
        lastAccessedAt:
          type: [string, "null"]
          format: date-time

    NotebookFolder:
      type: object
      required: [id, label, notebooks]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        notebooks:
          type: array
          items: { $ref: "#/components/schemas/NotebookListItem" }

    NotebookTree:
      type: object
      required: [folders, rootNotebooks]
      properties:
        folders:
          type: array
          items: { $ref: "#/components/schemas/NotebookFolder" }
        rootNotebooks:
          type: array
          items: { $ref: "#/components/schemas/NotebookListItem" }

    NotebookDetail:
      allOf:
        - $ref: "#/components/schemas/Notebook"
        - type: object
          required: [documents]
          properties:
            documents:
              type: array
              items: { $ref: "#/components/schemas/NotebookDocument" }

    CreateNotebookRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        folderId:
          type: [string, "null"]
          format: uuid
        prompt: { type: string }
        visibility:
          type: string
          enum: [private, shared]
          default: private

    UpdateNotebookRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        visibility:
          type: string
          enum: [private, shared]

    Folder:
      type: object
      required: [id, label, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ── Documents (schéma partagé, exposé par NotebookDetail — domaine complet à venir) ──
    DocumentKind:
      type: string
      enum: [pdf, audio, video, video-overview, recording]
      description: SOP §1.4.1. `recording` = domaine différé (hors Phase 1), présent pour compat de type.

    NotebookDocument:
      type: object
      required: [id, label, kind, uploadedAt, processingStatus]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        extension: { type: string }
        uploadedAt: { type: string, format: date-time }
        processingStatus: { $ref: "#/components/schemas/JobStatus" }

    # ── Users & me ───────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, email, fullName, onboardingComplete, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        profilePicture:
          type: [string, "null"]
          format: uri
        language:
          type: [string, "null"]
          description: ISO 639-1 — préférence d'interface.
        colorMode:
          type: [string, "null"]
          enum: [light, auto, dark, null]
        onboardingComplete: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpdateUserProfileRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        language: { type: string }
        colorMode:
          type: string
          enum: [light, auto, dark]
        onboardingComplete: { type: boolean }

    OnboardingRequest:
      type: object
      required: [language, skillArea, learningStyles, studyRhythm]
      properties:
        language:
          type: string
          enum: [en, fr]
        skillArea:
          type: string
          enum: [academic, professional, creative]
        learningStyles:
          type: array
          items: { type: string }
        studyRhythm: { type: string }
        invitedEmails:
          type: array
          items: { type: string, format: email }
          default: []

    NotificationChannel:
      type: string
      enum: [email_push, email_only, push_only]

    NotificationPreferences:
      type: object
      description: Les 7 types du SOP §1.6.2 — chacun avec son canal de livraison.
      properties:
        newMessage: { $ref: "#/components/schemas/NotificationChannel" }
        quizWarChallenge: { $ref: "#/components/schemas/NotificationChannel" }
        studyReminder: { $ref: "#/components/schemas/NotificationChannel" }
        friendJoin: { $ref: "#/components/schemas/NotificationChannel" }
        teamInvite: { $ref: "#/components/schemas/NotificationChannel" }
        weeklySummary: { $ref: "#/components/schemas/NotificationChannel" }
        productUpdates: { $ref: "#/components/schemas/NotificationChannel" }

    StudyStreak:
      type: object
      required: [currentStreak, longestStreak, totalDaysStudied, dailyActivity]
      properties:
        currentStreak: { type: integer, minimum: 0 }
        longestStreak: { type: integer, minimum: 0 }
        totalDaysStudied: { type: integer, minimum: 0 }
        dailyActivity:
          type: array
          items:
            type: object
            required: [date, minutesStudied, completed]
            properties:
              date: { type: string, format: date }
              minutesStudied: { type: integer, minimum: 0 }
              completed: { type: boolean }

    TopicProgress:
      type: object
      required: [topicId, label, notebookId, understandingPct, lastActivityAt]
      properties:
        topicId: { type: string, format: uuid }
        label: { type: string }
        notebookId: { type: string, format: uuid }
        understandingPct: { type: integer, minimum: 0, maximum: 100 }
        lastActivityAt: { type: string, format: date-time }

    Friend:
      type: object
      required: [userId, displayName, email]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        avatarUrl:
          type: [string, "null"]
          format: uri
        friendSince:
          type: [string, "null"]
          format: date-time

    UserSession:
      type: object
      required: [id, device, lastSeenAt, current]
      properties:
        id: { type: string }
        device: { type: string, description: "Navigateur / OS (user-agent résumé)." }
        location: { type: [string, "null"] }
        lastSeenAt: { type: string, format: date-time }
        current:
          type: boolean
          description: Session portant le token de la requête courante.

    ContactInfo:
      type: object
      required: [userId, displayName, email, sharedNotebooks, mutualFriends]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        avatarUrl:
          type: [string, "null"]
          format: uri
        sharedNotebooks:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
        mutualFriends: { type: integer, minimum: 0 }
        friendSince:
          type: [string, "null"]
          format: date-time

    # ── Documents & ingestion ────────────────────────────────────────────────
    DocumentJobAccepted:
      description: >
        Réponse 202 de l'ingestion — le document existe immédiatement (`processingStatus: pending`),
        `documentId` permet d'afficher la ligne et de poller le statut d'ingestion.
      allOf:
        - $ref: "#/components/schemas/JobAccepted"
        - type: object
          required: [documentId]
          properties:
            documentId: { type: string, format: uuid }

    DocumentProcessingStatus:
      type: object
      description: Shape ingestion (SOP §3.8) contraint au vocabulaire unifié + `stage` informatif.
      required: [documentId, status]
      properties:
        documentId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        stage:
          type: string
          enum: [transcribing, chunking, indexing]
          description: Étape courante pendant `processing` (informatif).
        progress: { type: integer, minimum: 0, maximum: 100 }
        errorMessage: { type: string }
        readyAt: { type: string, format: date-time }

    TranscriptSegment:
      type: object
      required: [content, start, end]
      properties:
        content: { type: string }
        start: { type: number, description: Secondes. }
        end: { type: number, description: Secondes. }

    DocumentChapter:
      type: object
      required: [name]
      properties:
        name: { type: string }
        pageNumber: { type: [integer, "null"] }
        startSeconds: { type: [number, "null"] }

    DocumentPreview:
      type: object
      description: >
        Contenu selon le `kind` — `pdf`: `url` (URL signée du viewer) ; `audio`/`video`:
        `transcript` + `chapters`.
      required: [documentId, kind]
      properties:
        documentId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        url:
          type: [string, "null"]
          format: uri
        transcript:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/TranscriptSegment" }
        chapters:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/DocumentChapter" }

    # ── Notes ────────────────────────────────────────────────────────────────
    Note:
      type: object
      required: [id, notebookId, title, body, sourceDocumentId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        notebookId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, description: Markdown. }
        sourceDocumentId:
          type: [string, "null"]
          format: uuid
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateNoteRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        body: { type: string }
        sourceDocumentId:
          type: string
          format: uuid

    # ── Calendar & study sessions ────────────────────────────────────────────
    CalendarEventParticipant:
      type: object
      required: [email]
      properties:
        userId:
          type: [string, "null"]
          format: uuid
          description: Renseigné si le participant est un utilisateur Graspr.
        email: { type: string, format: email }
        isYou: { type: boolean, default: false }

    CalendarEvent:
      type: object
      required: [id, seriesId, title, date, startTime, endTime, color, notebookId, activeRecall, completed, participants]
      properties:
        id: { type: string, format: uuid }
        seriesId:
          type: [string, "null"]
          format: uuid
          description: Présent si l'occurrence appartient à une série récurrente.
        title: { type: string }
        date: { type: string, format: date }
        startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "HH:mm, heure locale du user." }
        endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        color:
          type: string
          description: "Hex (#RRGGBB) — le front dérive les variantes bar/tint/filled."
        notebookId:
          type: [string, "null"]
          format: uuid
        activeRecall: { type: boolean }
        completed: { type: boolean }
        participants:
          type: array
          items: { $ref: "#/components/schemas/CalendarEventParticipant" }

    CreateCalendarEventRequest:
      type: object
      required: [title, color, from, to, startDate, timezone]
      properties:
        title: { type: string, minLength: 1 }
        color: { type: string, description: "Hex (#RRGGBB), un des 8 presets front." }
        from: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        to: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        startDate: { type: string, format: date }
        timezone: { type: string, description: "IANA (ex. Europe/Paris) — obligatoire pour le scheduling (§5.9)." }
        notebookId:
          type: [string, "null"]
          format: uuid
        activeRecall: { type: boolean, default: false }
        recurrence:
          type: string
          enum: [none, daily, weekly]
          default: none
        includeWeekends:
          type: boolean
          default: false
          description: S'applique à `recurrence=daily`.
        endDate:
          type: [string, "null"]
          format: date
          description: Fin de série (requis si `recurrence` ≠ none).
        friendIds:
          type: array
          items: { type: string, format: uuid }
          default: []

    UpdateCalendarEventRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string }
        color: { type: string }
        date: { type: string, format: date }
        from: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        to: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        notebookId:
          type: [string, "null"]
          format: uuid
        activeRecall: { type: boolean }
        completed: { type: boolean }
        scope:
          type: string
          enum: [single, series]
          default: single
          description: Portée de la modification pour une occurrence de série.

    TodaysPlanItem:
      type: object
      required: [id, notebookId, notebookTitle, timeLabel, color, activeRecall, completed]
      properties:
        id: { type: string, format: uuid }
        notebookId:
          type: [string, "null"]
          format: uuid
        notebookTitle: { type: [string, "null"] }
        timeLabel: { type: string, description: "Ex. \"9:00 AM – 10:00 AM\"." }
        color: { type: string }
        activeRecall: { type: boolean }
        completed: { type: boolean }

    CalendarConnection:
      type: object
      required: [provider, connectedAt]
      properties:
        provider:
          type: string
          enum: [google, microsoft]
        accountEmail: { type: [string, "null"], format: email }
        connectedAt: { type: string, format: date-time }

    StudySession:
      type: object
      required: [id, notebookId, durationSeconds, completedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        notebookId:
          type: [string, "null"]
          format: uuid
        durationSeconds: { type: integer, minimum: 1, maximum: 86400 }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    # ── Search ───────────────────────────────────────────────────────────────
    SearchResult:
      type: object
      required: [notebooks, documents, notes]
      properties:
        notebooks:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
        documents:
          type: array
          items:
            type: object
            required: [id, name, notebookId]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              notebookId: { type: string, format: uuid }
        notes:
          type: array
          items:
            type: object
            required: [id, excerpt, notebookId]
            properties:
              id: { type: string, format: uuid }
              excerpt: { type: string }
              notebookId: { type: string, format: uuid }

    # ── Chat AI ──────────────────────────────────────────────────────────────
    Citation:
      type: object
      description: >
        Grounding d'une réponse — les métadonnées existent déjà à l'ingestion
        (page_number, start, end — ai.service.ts:100-112).
      required: [documentId, excerpt]
      properties:
        documentId: { type: string, format: uuid }
        excerpt: { type: string }
        pageNumber: { type: [integer, "null"] }
        startSeconds:
          type: [number, "null"]
          description: Pour les sources audio/vidéo.
        endSeconds: { type: [number, "null"] }

    ChatMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string, description: Markdown. }
        createdAt: { type: string, format: date-time }
        sourceDocumentIds:
          type: array
          items: { type: string, format: uuid }
          description: Mode source uniquement — documents cités.
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
          description: Mode source uniquement, messages assistant.

    ChatMessagePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ChatMessage" }

    # ── Events SSE du chat (payload JSON des lignes `data:`) ─────────────────
    ChatTokenEvent:
      type: object
      required: [type, content]
      properties:
        type: { const: token }
        content:
          type: string
          description: Fragment de texte à concaténer, dans l'ordre d'arrivée.

    ChatCitationsEvent:
      type: object
      description: Émis une seule fois, avant `done` — mode source uniquement.
      required: [type, citations]
      properties:
        type: { const: citations }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }

    ChatDoneEvent:
      type: object
      description: Terminal — le message assistant est persisté, récupérable via l'historique.
      required: [type, messageId]
      properties:
        type: { const: done }
        messageId: { type: string, format: uuid }
        conversationId:
          type: string
          format: uuid
          description: Renvoyé pour permettre au front de poursuivre un thread créé implicitement.

    ChatErrorEvent:
      type: object
      description: Échec en cours de flux — mêmes sémantiques que le schéma `Error`, puis fermeture.
      required: [type, message, code]
      properties:
        type: { const: error }
        message: { type: string }
        code: { type: string, pattern: "^[A-Z0-9_]+$" }

    ChatStreamEvent:
      description: >
        Payload JSON d'une ligne `data:` du flux SSE. La sentinelle finale `data: [DONE]`
        n'est pas un JSON et n'est pas couverte par ce schéma.
      oneOf:
        - $ref: "#/components/schemas/ChatTokenEvent"
        - $ref: "#/components/schemas/ChatCitationsEvent"
        - $ref: "#/components/schemas/ChatDoneEvent"
        - $ref: "#/components/schemas/ChatErrorEvent"
      discriminator:
        propertyName: type
        mapping:
          token: "#/components/schemas/ChatTokenEvent"
          citations: "#/components/schemas/ChatCitationsEvent"
          done: "#/components/schemas/ChatDoneEvent"
          error: "#/components/schemas/ChatErrorEvent"

    # ── Summaries ────────────────────────────────────────────────────────────
    GenerateSummaryRequest:
      type: object
      required: [length, format]
      properties:
        documentIds:
          type: array
          items: { type: string, format: uuid }
          description: Sous-ensemble de sources ; absent = tout le notebook.
        length:
          type: string
          enum: [brief, standard, detailed]
        format:
          type: string
          enum: [paragraphs, bullet_points, outline]

    NotebookSummary:
      type: object
      required: [id, notebookId, title, body, wordCount, generatedAt, sourceDocumentIds, length, format]
      properties:
        id: { type: string, format: uuid }
        notebookId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, description: Markdown. }
        wordCount: { type: integer, minimum: 0 }
        generatedAt: { type: string, format: date-time }
        sourceDocumentIds:
          type: array
          items: { type: string, format: uuid }
        length:
          type: string
          enum: [brief, standard, detailed]
        format:
          type: string
          enum: [paragraphs, bullet_points, outline]
