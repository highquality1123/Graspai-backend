name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Lecture seule par défaut (principe du moindre privilège).
permissions:
  contents: read

# Annule les runs obsolètes d'une même PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (historique complet pour le diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn

      - name: Install (lockfile gelé)
        run: yarn install --frozen-lockfile

      # Bloque toute NOUVELLE vulnérabilité moderate+ ; tolère la baseline legacy (audit-ci.jsonc).
      - name: Audit dépendances (baseline)
        run: npx --yes audit-ci@^7 --config audit-ci.jsonc

      # Scoping : format/lint UNIQUEMENT sur ce que la PR modifie (diff vs merge-base).
      - name: Fichiers modifiés par la PR
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          # fetch + diff SANS `|| true` : si le calcul du diff échoue (fetch raté / base_ref
          # absent), le job échoue bruyamment — pas de skip silencieux des checks format/lint.
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" > all_changed.txt
          # Scope STRICT : uniquement le CODE SOURCE modifié (*.ts / *.js sous src/).
          # Exclut de fait le contrat gelé (openapi*.yaml), docs/**, *.md et la config racine.
          # `|| true` conservé UNIQUEMENT sur le grep : 0 correspondance (exit 1) = 0 fichier (légitime).
          grep -E '^src/.*\.(ts|js)$' all_changed.txt > src_changed.txt || true
          echo "----- source files in scope -----"; cat src_changed.txt || true
          echo "src_count=$(wc -l < src_changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Prettier (source modifié uniquement)
        if: github.event_name == 'pull_request' && steps.changed.outputs.src_count != '0'
        run: yarn format:check $(cat src_changed.txt)

      - name: ESLint (source modifié uniquement)
        if: github.event_name == 'pull_request' && steps.changed.outputs.src_count != '0'
        run: yarn lint:check $(cat src_changed.txt)

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test --ci

      - name: Contrat API (FR + EN)
        run: |
          yarn lint:api
          yarn lint:api:en

  gitleaks:
    name: Secret & dropper scan
    runs-on: ubuntu-latest
    # PR-only : le scan scopé au diff de PR (origin/<base>..HEAD) a besoin de base_ref, absent sur push.
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    # Binaire gitleaks (MIT) épinglé — pas d'action tierce, pas de licence, pas de secret à gérer.
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (version + checksum épinglés)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan du diff de la PR (secrets + signatures dropper)
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          # Scope au diff de la PR (origin/<base>..HEAD) : protège le futur sans re-scanner
          # le malware historique de a145775 (dans la base, hors range).
          gitleaks detect \
            --config .gitleaks.toml \
            --log-opts="origin/${{ github.base_ref }}..HEAD" \
            --redact --no-banner --verbose
